[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "capex"
version = "1.0.9"
description = "Config-driven network attack capture orchestration for security research"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Seth Barrett" }
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "pydantic>=2.13.4,<3",
]

[project.scripts]
capex = "capex.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.15.16,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "deptry>=0.25.1,<1",
  "twine>=6.2.0,<7",
]
scripting = [
    "cicflowmeter",
    "pandas==3.0.3",
    { include-group = "dev" },
]

[tool.uv.sources]
cicflowmeter = { git = "https://github.com/sethbarrett50/cicflowmeter" }

[tool.hatch.build.targets.wheel]
packages = ["src/capex"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "-q",
  "--strict-markers",
  "--strict-config",
]
pythonpath = ["src"]

[tool.uv]
package = true

[tool.deptry]
root = ["src", "scripts"]

[tool.deptry.per_rule_ignores]
DEP001 = ["capex"]
DEP003 = ["capex"]
DEP004 = ["pandas"]
