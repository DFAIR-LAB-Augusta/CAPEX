attacks:
  - name: xmas_flood
    label: XMAS_Flood
    enabled: true
    repeats: 3
    command:
      - nmap
      - -sX
      - -p
      - 1-100
      - "{target_ip}"

  - name: tcp_syn_flood
    label: TCP_SYN_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "443"
      - "{target_ip}"

  - name: udp_flood
    label: UDP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - --udp
      - -c
      - "100"
      - -p
      - "53"
      - "{target_ip}"

  - name: http_flood
    label: HTTP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "80"
      - "{target_ip}"

  # Original FIRCE Concept drift
  - name: hulk_http_flood
    label: HULK_HTTP_Flood
    kind: hulk
    enabled: true
    repeats: 3
    duration_seconds: 60

  # Reconnaissance / Discovery (#75)
  - name: nmap_service_detection
    label: Nmap_Service_Detection
    enabled: true
    repeats: 3
    command:
      - nmap
      - -sV
      - -p
      - 1-1000
      - "{target_ip}"

  - name: ssdp_discovery
    label: SSDP_Discovery
    kind: ssdp_discovery
    enabled: true
    repeats: 3
    timeout_seconds: 3

  - name: banner_grab_http
    label: Banner_Grab_HTTP
    kind: banner_grab
    enabled: true
    repeats: 3
    port: 80
    timeout_seconds: 5
    probe: "HEAD / HTTP/1.0\r\nHost: {target_ip}\r\n\r\n"

  # Credential Access (#76)
  - name: hydra_http_default_creds
    label: Hydra_HTTP_Default_Creds
    kind: hydra_brute_force
    enabled: true
    repeats: 3
    service: http-get
    port: 80
    username_list:
      - admin
      - root
    password_list:
      - admin
      - "1234"
      - password
    max_attempts: 6
    tasks: 1

  # Application-layer (#77)
  - name: slowloris
    label: Slowloris
    enabled: true
    repeats: 3
    command:
      - slowhttptest
      - -c
      - "1000"
      - -H
      - -i
      - "10"
      - -r
      - "200"
      - -t
      - GET
      - -u
      - http://{target_ip}/
      - -x
      - "24"
      - -p
      - "3"

  - name: http_fuzz
    label: HTTP_Fuzz
    kind: http_fuzz
    enabled: true
    repeats: 3
    port: 80
    paths:
      - /../../../../etc/passwd
      - /..%2f..%2f..%2f..%2fetc%2fpasswd
      - "/'; DROP TABLE users;--"
      - "/<script>alert(1)</script>"
      - /%00
      - /.git/config
    timeout_seconds: 5

  # Lateral Movement / C2 (#78)
  - name: c2_beacon
    label: C2_Beacon
    kind: c2_beacon
    enabled: true
    repeats: 5
    port: 80
    path: /check-in
    jitter_seconds: 5
    timeout_seconds: 5

