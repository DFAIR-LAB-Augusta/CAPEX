attacks:
  - name: xmas_flood
    label: XMAS_Flood
    enabled: true
    repeats: 3
    command:
      - nmap
      - -sX
      - -p
      - 1-100
      - "{target_ip}"

  - name: tcp_syn_flood
    label: TCP_SYN_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "443"
      - "{target_ip}"

  - name: udp_flood
    label: UDP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - --udp
      - -c
      - "100"
      - -p
      - "53"
      - "{target_ip}"

  - name: http_flood
    label: HTTP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "80"
      - "{target_ip}"

  # Original FIRCE Concept drift
  - name: hulk_http_flood
    label: HULK_HTTP_Flood
    kind: hulk
    enabled: true
    repeats: 3
    duration_seconds: 60

  # Application-layer (#77)
  - name: slowloris
    label: Slowloris
    enabled: true
    repeats: 3
    command:
      - slowhttptest
      - -c
      - "1000"
      - -H
      - -i
      - "10"
      - -r
      - "200"
      - -t
      - GET
      - -u
      - http://{target_ip}/
      - -x
      - "24"
      - -p
      - "3"

  - name: http_fuzz
    label: HTTP_Fuzz
    kind: http_fuzz
    enabled: true
    repeats: 3
    port: 80
    paths:
      - /../../../../etc/passwd
      - /..%2f..%2f..%2f..%2fetc%2fpasswd
      - "/'; DROP TABLE users;--"
      - "/<script>alert(1)</script>"
      - /%00
      - /.git/config
    timeout_seconds: 5

