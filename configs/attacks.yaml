attacks:
  - name: xmas_flood
    label: XMAS_Flood
    enabled: true
    repeats: 3
    command:
      - nmap
      - -sX
      - -p
      - 1-100
      - "{target_ip}"

  - name: tcp_syn_flood
    label: TCP_SYN_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "443"
      - "{target_ip}"

  - name: udp_flood
    label: UDP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - --udp
      - -c
      - "100"
      - -p
      - "53"
      - "{target_ip}"

  - name: http_flood
    label: HTTP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "80"
      - "{target_ip}"

  # Original FIRCE Concept drift
  - name: hulk_http_flood
    label: HULK_HTTP_Flood
    kind: hulk
    enabled: true
    repeats: 3
    duration_seconds: 60

  # Lateral Movement / C2 (#78)
  - name: c2_beacon
    label: C2_Beacon
    kind: c2_beacon
    enabled: true
    repeats: 5
    port: 80
    path: /check-in
    jitter_seconds: 5
    timeout_seconds: 5

  # Lateral Movement / C2 #2 (#92)
  - name: c2_dns_beacon
    label: C2_DNS_Beacon
    kind: c2_dns_beacon
    enabled: true
    repeats: 5
    port: 53
    domain: update-check.example
    jitter_seconds: 5
    timeout_seconds: 5

