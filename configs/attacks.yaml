attacks:
  - name: xmas_flood
    label: XMAS_Flood
    enabled: true
    repeats: 3
    command:
      - nmap
      - -sX
      - -p
      - 1-100
      - "{target_ip}"

  - name: tcp_syn_flood
    label: TCP_SYN_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "443"
      - "{target_ip}"

  - name: udp_flood
    label: UDP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - --udp
      - -c
      - "100"
      - -p
      - "53"
      - "{target_ip}"

  - name: http_flood
    label: HTTP_Flood
    enabled: true
    repeats: 3
    command:
      - hping3
      - -S
      - -c
      - "100"
      - -p
      - "80"
      - "{target_ip}"

  # Original FIRCE Concept drift
  - name: hulk_http_flood
    label: HULK_HTTP_Flood
    kind: hulk
    enabled: true
    repeats: 3
    duration_seconds: 60

  # Reflection/Amplification DDoS (#81)
  # 192.168.1.250 is a decoy spoofed-victim IP, not a real device on this
  # lab network - it is not present in devices.yaml. DNS/NTP reflection are
  # deliberately not included here: the lab devices are consumer IoT
  # hardware (hubs/cams/plugs) that expose UPnP/SSDP, not open DNS
  # resolvers or NTP servers, so spoofed DNS/NTP queries at them wouldn't
  # elicit any real amplified response - just non-functional traffic.
  - name: ssdp_reflection
    label: SSDP_Reflection
    enabled: true
    repeats: 3
    command:
      - hping3
      - --spoof
      - 192.168.1.250
      - --udp
      - -c
      - "5"
      - -p
      - "1900"
      - -E
      - configs/payloads/ssdp_msearch.txt
      - "{target_ip}"

