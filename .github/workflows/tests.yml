name: Tests

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ github.event_name == 'push' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && vars.DFAIR_ARC_TRUSTED_PUSH == 'true' && 'dfair-gha-runner-arc' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.13.9'
          enable-cache: false

      - name: Show bootstrap Python and uv
        run: |
          python3 --version
          which python3
          uv --version

      - name: Install requested Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: |
          uv run --python ${{ matrix.python-version }} pytest -q \
            --cov=capex --cov-report=term-missing --cov-fail-under=90

      - name: Build artifacts
        run: uv build --python ${{ matrix.python-version }}