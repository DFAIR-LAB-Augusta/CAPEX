name: style

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ruff-style:
    runs-on: ${{ github.event_name == 'push' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && vars.DFAIR_ARC_TRUSTED_PUSH == 'true' && 'dfair-gha-runner-arc' || 'ubuntu-latest' }}

    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.13.9'
          enable-cache: false

      - name: Show bootstrap Python and uv
        run: |
          python3 --version
          which python3
          uv --version

      - name: Install requested Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Ruff format
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Ruff lint
        run: uv run --python ${{ matrix.python-version }} ruff check .